<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photos — Devin Bowler</title>
  <meta name="description" content="Photos by Devin Bowler.">
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="site-frame">

    <header class="site-header">
      <div class="header-top">
        <a class="header-home" href="https://devinbowler.com">← devinbowler.com</a>
        <div class="header-actions">
          <span class="session-pill" id="sessionPill" hidden></span>
          <button class="btn btn-sm btn-outline" id="uploadBtn" type="button">Upload</button>
        </div>
      </div>

      <div class="title-row">
        <h1>Photos</h1>
        <p class="subtitle">Pictures I&rsquo;ve taken, loosely sorted.</p>
      </div>

      <div class="control-row">
        <nav class="tabs" id="tabs">
          <button class="tab active" data-view="gallery" type="button">Gallery</button>
          <button class="tab" data-view="albums" type="button">Albums</button>
        </nav>

        <div class="density" id="density" role="group" aria-label="Photos per row">
          <button class="density-btn" data-cols="3" type="button" title="3 per row">
            <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><rect x="1" y="7" width="6" height="10" rx="1.5"/><rect x="9" y="7" width="6" height="10" rx="1.5"/><rect x="17" y="7" width="6" height="10" rx="1.5"/></svg>
          </button>
          <button class="density-btn active" data-cols="4" type="button" title="4 per row">
            <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><rect x="1" y="8" width="4.4" height="8" rx="1.2"/><rect x="7" y="8" width="4.4" height="8" rx="1.2"/><rect x="13" y="8" width="4.4" height="8" rx="1.2"/><rect x="19" y="8" width="4" height="8" rx="1.2"/></svg>
          </button>
          <button class="density-btn" data-cols="5" type="button" title="5 per row">
            <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><rect x="1" y="9" width="3.4" height="6" rx="1"/><rect x="5.6" y="9" width="3.4" height="6" rx="1"/><rect x="10.2" y="9" width="3.4" height="6" rx="1"/><rect x="14.8" y="9" width="3.4" height="6" rx="1"/><rect x="19.4" y="9" width="3.4" height="6" rx="1"/></svg>
          </button>
        </div>
      </div>
    </header>

    <main class="site-main" id="main"></main>

    <footer class="site-footer">
      <span>&copy; <span id="year"></span> Devin Bowler</span>
      <a href="https://devinbowler.com">Portfolio</a>
    </footer>
  </div>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox" hidden>
    <div class="lightbox-scrim" data-close="1"></div>
    <button class="lightbox-close" id="lbClose" type="button" aria-label="Close">&times;</button>
    <button class="lightbox-nav prev" id="lbPrev" type="button" aria-label="Previous">&#8249;</button>
    <button class="lightbox-nav next" id="lbNext" type="button" aria-label="Next">&#8250;</button>
    <div class="lightbox-stage">
      <div class="lightbox-image-wrap">
        <img id="lbImage" alt="">
      </div>
      <div class="caption-card" id="lbCaptionCard">
        <p class="caption-text" id="lbCaption"></p>
        <span class="caption-meta" id="lbMeta"></span>
        <div class="caption-owner" id="lbOwnerTools" hidden>
          <textarea id="lbCaptionInput" rows="2" placeholder="Add a caption"></textarea>
          <label class="caption-check">
            <input type="checkbox" id="lbInGallery">
            Show in the public gallery
          </label>
          <div class="caption-owner-actions">
            <button class="btn btn-sm btn-primary" id="lbSaveCaption" type="button">Save caption</button>
            <button class="btn btn-sm btn-ghost danger" id="lbDelete" type="button">Delete photo</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal shell -->
  <div class="modal" id="modal" hidden>
    <div class="modal-scrim" data-close="1"></div>
    <div class="modal-card" id="modalCard"></div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
